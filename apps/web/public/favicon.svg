<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1F3D" />
      <stop offset="100%" stop-color="#071327" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E3B" />
      <stop offset="100%" stop-color="#E20613" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Shield / Base Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="8" />
  
  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="16 12" opacity="0.4" />
  
  <!-- Main GPS Pin Icon -->
  <path d="M256 90 C184.2 90 126 148.2 126 220 C126 310 256 422 256 422 C256 422 386 310 386 220 C386 148.2 327.8 90 256 90 Z" fill="url(#pinGrad)" />
  
  <!-- Inner White Core -->
  <circle cx="256" cy="220" r="64" fill="#FFFFFF" />
  
  <!-- Smart Checkmark / S Node inside Pin -->
  <path d="M220 220 L244 244 L296 192" fill="none" stroke="#0D1F3D" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
</svg>
